{% set version = "0.6.8" %}

package:
  name: hipstr-mt
  version: {{ version }}

source:
  url: https://github.com/TurakhiaLab/HipSTR-MT/archive/refs/tags/v{{ version }}.tar.gz
  # A tarball cannot contain its own checksum: GitHub generates this archive
  # from the tagged tree, so any commit that writes the hash here changes the
  # tree and invalidates the value it just wrote. Fill this in when copying the
  # recipe into a bioconda-recipes PR -- the hash is published in the GitHub
  # Release notes for the matching tag, or recompute it with:
  #   curl -sL https://github.com/TurakhiaLab/HipSTR-MT/archive/refs/tags/v{{ version }}.tar.gz | sha256sum
  sha256: REPLACE_AT_SUBMISSION_TIME

build:
  number: 0
  # Native x86_64 binary: ISA dispatch (src/mathops.cpp's target_clones) is
  # decided at runtime via cpuid, but the build itself assumes x86_64 (SSE2/
  # AVX intrinsics used directly elsewhere) and Linux (/proc/self/status,
  # sched_getaffinity -- see README's Requirements section).
  skip: True  # [not (linux and x86_64)]

requirements:
  build:
    - {{ compiler('cxx') }}
    - make
    - cmake >=3.18
  host:
    - zlib
    - bzip2
    - xz
    - libcurl
    - openssl
  run:
    - zlib
    - bzip2
    - xz
    - libcurl
    - openssl

test:
  commands:
    - HipSTR-MT --help

about:
  home: https://github.com/TurakhiaLab/HipSTR-MT
  license: GPL-2.0-only
  license_file: LICENSE
  summary: "Multi-threaded fork of HipSTR, a haplotype-based STR genotyper for Illumina sequencing data"
  description: |
    HipSTR-MT adds thread-level parallelization (--threads), additional
    vectorization, and memory optimizations to HipSTR, the haplotype-based
    short tandem repeat (STR) genotyping tool originally developed by
    Thomas Willems et al. It produces the same genotype calls as upstream
    HipSTR at any thread count -- see the README's Testing and Correctness
    sections -- while running substantially faster on multi-core machines.
  doc_url: https://github.com/TurakhiaLab/HipSTR-MT/blob/main/README.md

extra:
  recipe-maintainers:
    - JGalil
